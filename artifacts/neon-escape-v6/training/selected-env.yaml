        num_samples: 2
      include_center: true
      direction: !!python/tuple
      - 0.0
      - 0.0
      - -1.0
    ray_alignment: yaw
    max_distance: 1.0
    exclude_parent_body: true
    include_geom_groups: !!python/tuple
    - 0
    debug_vis: false
    viz:
