    primary:
      mode: geom
      pattern: ^(left_foot_collision|right_foot_collision)$
      entity: robot
      exclude: !!python/tuple []
    secondary:
      mode: body
      pattern: terrain
      entity: null
      exclude: !!python/tuple []
    fields: !!python/tuple
