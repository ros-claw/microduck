[project]
name = "microduck-lab"
version = "0.1.0"
description = "Microduck Duckverse — reproducible physical robot skills and games in MuJoCo"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "mujoco>=3.12,<3.13",
    "onnxruntime>=1.17",
    "numpy>=1.26",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
rosclaw = ["mcp>=1.0,<2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/microduck_lab"]
