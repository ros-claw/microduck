[project]
name = "microduck-lab"
version = "0.1.0"
description = "Microduck Circus — three ROSClaw ducks learn to skip a long rope (Pollen Microduck × MuJoCo × ROSClaw loop)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "mujoco>=3.2",
    "onnxruntime>=1.17",
    "numpy>=1.26",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "pillow>=10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/microduck_lab"]
